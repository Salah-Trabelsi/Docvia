name: docvia

services:
  docvia:
    container_name: docvia
    image: docvia:latest
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FRONTEND_URL: http://localhost:3000
      SERVE_FRONTEND: "true"
      DOCKER_LOCAL_HTTP: "true"
      TRUSTED_PROXY_CIDRS: ""
      APPOINTMENT_EMAIL_WORKER_ENABLED: "${APPOINTMENT_EMAIL_WORKER_ENABLED:-false}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || (await r.json()).status !== 'ok') process.exit(1)}).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
