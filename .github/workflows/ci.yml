name: CI - Quality, Tests & Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_docker:
        description: Build the Docker image after frontend/backend checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0
      - name: Run all existing hooks
        run: pre-commit run --all-files --show-diff-on-failure

  frontend-tests:
    name: Frontend Tests
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run all unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = 'test-results.json';
          if (!existsSync(file)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Frontend Tests\nNo test report was produced; inspect the preceding steps.\n');
          } else {
            const result = JSON.parse(readFileSync(file, 'utf8'));
            const rows = [
              ['Total', result.numTotalTests],
              ['Passed', result.numPassedTests],
              ['Failed', result.numFailedTests],
              ['Pending', result.numPendingTests],
              ['Todo', result.numTodoTests],
            ];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Frontend Tests\n\n| Result | Tests |\n| --- | ---: |\n' +
              rows.map(([label, count]) => `| ${label} | ${count ?? 0} |`).join('\n') + '\n');
          }
          NODE
      - name: Build
        run: npm run build

  backend-tests:
    name: Backend Tests
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck unit tests
        run: npm run typecheck:tests
      - name: Run all unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = 'test-results.json';
          if (!existsSync(file)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Backend Tests\nNo test report was produced; inspect the preceding steps.\n');
          } else {
            const result = JSON.parse(readFileSync(file, 'utf8'));
            const rows = [
              ['Total', result.numTotalTests],
              ['Passed', result.numPassedTests],
              ['Failed', result.numFailedTests],
              ['Pending', result.numPendingTests],
              ['Todo', result.numTodoTests],
            ];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Backend Tests\n\n| Result | Tests |\n| --- | ---: |\n' +
              rows.map(([label, count]) => `| ${label} | ${count ?? 0} |`).join('\n') + '\n');
          }
          NODE
      - name: Build
        run: npm run build

  frontend-coverage:
    name: Frontend Coverage
    needs: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate V8 coverage
        run: npm run test:coverage
      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = 'coverage/coverage-summary.json';
          if (!existsSync(file)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Frontend Coverage\nNo coverage report was produced; inspect the preceding steps.\n');
          } else {
            const { total } = JSON.parse(readFileSync(file, 'utf8'));
            const metrics = ['statements', 'branches', 'functions', 'lines'];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Frontend Coverage\n\n| Metric | Coverage |\n| --- | ---: |\n' +
              metrics.map(key => `| ${key[0].toUpperCase() + key.slice(1)} | ${total[key].pct}% |`).join('\n') + '\n');
          }
          NODE
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: error

  backend-coverage:
    name: Backend Coverage
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate V8 coverage
        run: npm run test:coverage
      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = 'coverage/coverage-summary.json';
          if (!existsSync(file)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Backend Coverage\nNo coverage report was produced; inspect the preceding steps.\n');
          } else {
            const { total } = JSON.parse(readFileSync(file, 'utf8'));
            const metrics = ['statements', 'branches', 'functions', 'lines'];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Backend Coverage\n\n| Metric | Coverage |\n| --- | ---: |\n' +
              metrics.map(key => `| ${key[0].toUpperCase() + key.slice(1)} | ${total[key].pct}% |`).join('\n') + '\n');
          }
          NODE
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: error

  docker:
    name: Docker Build
    needs: [frontend-coverage, backend-coverage]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image without running or publishing it
        run: docker build --pull --file Docker/Dockerfile --tag docvia:ci .
